name: Compilar Bubble BDS Host

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  apk:
    name: Compilar APK v0.2
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar PRoot clássico ARM64
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl xz-utils patchelf binutils dpkg
          chmod +x scripts/fetch_classic_proot.sh
          scripts/fetch_classic_proot.sh

      - name: Verificar runtime PRoot
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/jniLibs/arm64-v8a/libproot_classic.so
          test -s app/src/main/jniLibs/arm64-v8a/libproot_loader.so
          test -s app/src/main/jniLibs/arm64-v8a/libandroid-shmem.so
          test -s app/src/main/jniLibs/arm64-v8a/libtalloc.so
          file app/src/main/jniLibs/arm64-v8a/libproot_classic.so
          file app/src/main/jniLibs/arm64-v8a/libproot_loader.so
          readelf -d app/src/main/jniLibs/arm64-v8a/libproot_classic.so | grep NEEDED || true

      - name: Verificar Android SDK disponível
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK debug
        run: gradle :app:assembleDebug --stacktrace

      - name: Verificar APK produzido
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          ls -lh "$APK"
          unzip -l "$APK" | grep -E 'libproot_classic|libproot_loader|libandroid-shmem|libtalloc'

      - name: Enviar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: BubbleBDSHost-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
