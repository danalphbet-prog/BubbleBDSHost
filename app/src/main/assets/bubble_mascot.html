'espada de ouro':u=>u<.3?-70+3*Math.sin(u*40):u<.5?-65+12*Math.sin((u-.3)*70):u<.68?-60+80*Math.sin((u-.5)/.18*Math.PI*6):u<.8?-15+75*Math.sin((u-.68)/.12*Math.PI*4-Math.PI/6):u<.85?L(-52.5,-95,E3((u-.8)/.05)):u<.97?-95+8*Math.sin((u-.85)*18):L(-95,-60,E3((u-.97)/.03)),
'espada de diamante':u=>{if(u<.4||u>=.9)return -60;const q=(u-.4)/.5*7,k=Math.min(6,Math.floor(q));return L(SEQ[k],SEQ[k+1],E3(Math.min(1,(q-k)*1.15)))},

function trailArc(ox,oy,a0,a1,col){const lo=Math.min(a0,a1),hi=Math.max(a0,a1),w=hi-lo;if(w<10||w>200)return;
 for(let dy=-42;dy<=42;dy++)for(let dx=-42;dx<=42;dx++){const r=Math.hypot(dx,dy);if(r<17||r>41)continue;const g=Math.atan2(dy,dx)*57.2958;if(g<lo||g>hi)continue;const f=(g-lo)/w,age=a1>a0?f:1-f;px(ox+dx,oy+dy,col,age*age*.85*Math.min(1,(r-17)/14))}}
function slash(bx,by,dt){const Sw=SWORDS[cur],sp=SWS[Sw.s],u=mu,ox=bx+58,oy=by+46,A=ANG[cur],tt=performance.now()/1000;GBX=bx;GBY=by;
 if(Sw.sp&&u>=.05&&u<.34){const H=Sw.H;let h,spin=0;if(u<.2){const s=(u-.05)/.15;h=H*(1-(1-s)*(1-s))}else if(u<.24)h=H;else{const s=(u-.24)/.1;h=H*(1-s*s);spin=720*s}
  const c=Math.cos(-15*Math.PI/180),s2=Math.sin(-15*Math.PI/180);dp(sp,ox+11*c+10*s2,oy+11*s2-10*c-h,8,8,-15+spin)}
 else{const a=A(u);if(Sw.trail)trailArc(ox,oy,A(Math.max(0,u-.08/Sw.c)),a,Sw.trail);dp(sp,ox,oy,2.5,13,a+45)}
 if(Sw.sp&&u>.4&&Math.random()<.3)PART.push({x:bx-4+Math.random()*76,y:by-4+Math.random()*66,vx:0,vy:-8,l:.3,c:Sw.sc[Math.random()*Sw.sc.length|0]});
 if((cur==='espada de netherite'&&u>.56&&u<.97)||(cur==='espada de ouro'&&u>.83&&u<.98)){const g=(tt*1.3)%1,aa=A(u)*Math.PI/180,gx=ox+(10+26*g)*Math.cos(aa),gy=oy+(10+26*g)*Math.sin(aa);[[0,0],[-2,0],[2,0],[0,-2],[0,2]].forEach(([x,y])=>px(gx+x,gy+y,'#ffffff',g<.9?1:.4))}
 if((cur==='espada de cobre'&&u>.3&&u<.95)||(cur==='espada de ouro'&&u>.3&&u<.8))gl(QM,bx+46,by+Math.round(Math.sin(tt*4)*2),'#8b7bff');

   if(on&&cb>.01&&y>6.8-cb*8*(1-Math.pow((u-3.5)/5,2)))on=false}

}

function mouth(x0,y0){
 const hw=Math.min(16,Math.max(3,S.mw*.68)),mo=Math.max(0,S.mo);
 for(let x=0;x<32;x++){const s=(x-15.5)/hw;if(Math.abs(s)>1.05)continue;

}
