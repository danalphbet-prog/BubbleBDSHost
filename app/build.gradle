import java.util.Properties

plugins {
    id 'com.android.application'
}

def signingProps = new Properties()
def signingFile = rootProject.file('keystore.properties')
if (signingFile.exists()) {
    signingFile.withInputStream { signingProps.load(it) }
}

android {
    namespace 'com.bubble.bdshost'
    compileSdk 35

    defaultConfig {
        applicationId 'com.bubble.bdshost'
        minSdk 26
        targetSdk 35
        versionCode 18
        versionName '0.9.1'
        ndk { abiFilters 'arm64-v8a' }
    }

    signingConfigs {
        release {
            if (signingFile.exists()) {
                storeFile file(signingProps['storeFile'])
                storePassword signingProps['storePassword']
                keyAlias signingProps['keyAlias']
                keyPassword signingProps['keyPassword']
                storeType signingProps.getProperty('storeType', 'PKCS12')
            }
        }
    }

    buildTypes {
        debug { minifyEnabled false }
        release {
            minifyEnabled false
            if (signingFile.exists()) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += ['**/libproot_classic.so', '**/libproot_loader.so']
        }
    }
}

dependencies {
    implementation 'org.apache.commons:commons-compress:1.27.1'
    implementation 'commons-io:commons-io:2.16.1'
    implementation 'org.tukaani:xz:1.10'
}
